[project]
name = "herdboard"
version = "0.2.0"
description = "Kanban board for local todos and Linear issues, inside Herdr"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "tomlkit>=0.15.1",
]

[dependency-groups]
dev = [
    "graphql-core>=3.3.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
]

[project.scripts]
herdboard = "herdboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
xfail_strict = true
markers = ["real_pi_flags: run the real herdboard.pi_extensions.pi_flags, not the conftest stand-in"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF100"]
